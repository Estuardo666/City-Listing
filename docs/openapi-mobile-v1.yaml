        website: { type: string, format: uri }
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        priceRange: { type: string, maxLength: 20 }
        image: { type: string, format: uri, maxLength: 2000 }
        categoryIds: { type: array, maxItems: 10, items: { type: string } }
    CreatePostRequest:
      type: object
      required: [title, content, categoryId]
      properties:
        title: { type: string, minLength: 3, maxLength: 160 }
        excerpt: { type: string, maxLength: 500 }
        content: { type: string, minLength: 20, maxLength: 20000 }
        image: { type: string, format: uri, maxLength: 2000 }
        categoryId: { type: string }
    CreateRouteRequest:
      type: object
      required: [title, description, type]
      properties:
        title: { type: string, minLength: 3, maxLength: 160 }
        description: { type: string, minLength: 10, maxLength: 5000 }
        content: { type: string, maxLength: 20000 }
        image: { type: string, format: uri, maxLength: 2000 }
        duration: { type: string, maxLength: 80 }
        difficulty: { type: string, maxLength: 40 }
        type: { type: string, minLength: 2, maxLength: 40 }
        stops:
          type: array
          maxItems: 50
          items:
            type: object
            required: [title]
            properties:
              venueId: { type: string }
              title: { type: string, minLength: 2, maxLength: 160 }
              notes: { type: string, maxLength: 500 }
              duration: { type: string, maxLength: 80 }
    TokenEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            fields: { type: object, additionalProperties: { type: array, items: { type: string } } }
  responses:
    BadRequest:
      description: Invalid input
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    ValidationError:
      description: The request body failed validation (VALIDATION_ERROR)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: Authentication required or invalid
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: Authenticated user is not allowed to perform this action
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: Resource conflict
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Resource not found
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    ServiceUnavailable:
      description: Optional provider is not configured
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
