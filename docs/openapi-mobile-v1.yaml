openapi: 3.1.0
info:
  title: Vive Loja Mobile API
  version: 1.0.0
  description: Versioned contract consumed by the Vive Loja iOS client.
servers:
  - url: https://viveloja.com/api/mobile/v1
tags:
  - name: Health
  - name: Auth
  - name: Home
  - name: Explore
  - name: Content
  - name: Transmissions
  - name: Analytics
  - name: User
security: []
paths:
  /agenda:
    get:
      tags: [Content]
      operationId: getAgenda
      summary: Chronological agenda in America/Guayaquil
      description: Up to 100 approved remaining or ongoing events. Weekend means Saturday and Sunday, or the remaining part of the current weekend. Unknown price is null, never free. Cancelled events are excluded.
      parameters:
        - in: query
          name: period
          schema: { type: string, enum: [today, tomorrow, weekend, upcoming], default: today }
      responses:
        '200':
          description: Chronologically sorted events
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, title, slug, startDate, location]
                      properties:
                        id: { type: string }
                        title: { type: string }
                        slug: { type: string }
                        image: { type: [string, 'null'] }
                        startDate: { type: string, format: date-time }
                        endDate: { type: [string, 'null'], format: date-time }
                        location: { type: string }
                        price: { type: [number, 'null'] }
        '422': { description: Invalid period }
        '500': { description: Agenda unavailable }
  /me/event-updates:
    get:
      tags: [User]
      operationId: getSavedEventUpdates
      summary: Latest 50 schedule-change and cancellation notices for the signed-in user
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Persisted inbox, regardless of push permission or transport availability
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, title, body, slug, createdAt]
                      properties:
                        id: { type: string }
                        title: { type: string }
                        body: { type: string }
                        slug: { type: string }
                        createdAt: { type: string, format: date-time }
        '401': { description: Authentication required }
        '500': { description: Inbox unavailable }
  /today:
    get:
      tags: [Home]
      operationId: getTodayInLoja
      summary: Today's remaining events, open venues, short routes and editorial venue collections
      description: Uses America/Guayaquil day boundaries. No-store. Only public approved content. Unknown hours are excluded. Collections must be public, authored by an admin and contain only approved active venues.
      responses:
        "200":
          description: Today's discovery sections, including empty arrays when no content qualifies
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [date, timeZone, generatedAt, events, openVenues, routes, collections]
                    properties:
                      date: { type: string, format: date }
                      timeZone: { type: string, const: America/Guayaquil }
                      generatedAt: { type: string, format: date-time }
                      events: { type: array, items: { $ref: '#/components/schemas/TodayCard' } }
                      openVenues: { type: array, items: { $ref: '#/components/schemas/TodayCard' } }
                      routes: { type: array, items: { $ref: '#/components/schemas/TodayCard' } }
                      collections: { type: array, items: { $ref: '#/components/schemas/TodayCard' } }
        "500":
          description: Temporary discovery service failure
  /interactions:
    post:
      tags: [Analytics]
      operationId: recordDirectionsIntent
      summary: Record a directions click, never a physical visit
      description: Public, rate limited, deduplicated in 30-minute buckets. Save events are recorded atomically by the authenticated favorites mutation, never accepted here. Analytics failures must not block navigation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, kind, itemId, source]
              properties:
                action: { type: string, const: directions }
                kind: { type: string, enum: [venue, event, route] }
                itemId: { type: string, minLength: 1, maxLength: 100 }
                source: { type: string, enum: [web, ios, android] }
      responses:
        "200": { description: Accepted; data.recorded is false for a duplicate }
        "403": { description: Cross-origin browser request rejected }
        "404": { description: Content is not public }
        "422": { description: Invalid input }
        "429": { description: Rate limit reached }
        "500": { description: Recording unavailable }
  /health:
    get:
      tags: [Health]
      summary: Check mobile API availability
      operationId: getMobileHealth
      responses:
        "200":
          description: API is available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a mobile user
      operationId: registerMobileUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: User created
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in with email and password
      operationId: loginMobileUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/apple:
    post:
      tags: [Auth]
      summary: Sign in with Apple identity token
      operationId: loginMobileUserWithApple
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppleLoginRequest"
      responses:
        "200":
          description: Session tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate a mobile refresh session
      operationId: refreshMobileSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Rotated session tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke a mobile refresh session
      operationId: logoutMobileSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /home:
    get:
      tags: [Home]
      summary: Load featured, latest, related and editorial home sections
      operationId: getMobileHome
      responses:
        "200":
          description: Home sections
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/HomePayload"
  /explore:
    get:
      tags: [Explore]
      summary: Search venues and events with filters
      operationId: exploreMobileContent
      parameters:
        - { $ref: "#/components/parameters/Query" }
        - { $ref: "#/components/parameters/Type" }
        - { $ref: "#/components/parameters/Take" }
        - { $ref: "#/components/parameters/VenueSkip" }
        - { $ref: "#/components/parameters/EventSkip" }
        - { $ref: "#/components/parameters/Latitude" }
        - { $ref: "#/components/parameters/Longitude" }
        - { $ref: "#/components/parameters/Radius" }
      responses:
        "200":
          description: Explore results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /venues/{slug}:
    get:
      tags: [Content]
      summary: Load a venue detail
      operationId: getMobileVenue
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Venue detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/VenueDetail"
        "404": { $ref: "#/components/responses/NotFound" }
  /events/{slug}:
    get:
      tags: [Content]
      summary: Load an event detail
      operationId: getMobileEvent
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Event detail
          content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /content:
    get:
      tags: [Content]
      summary: Load public content sections
      operationId: getMobileContent
      parameters:
        - { $ref: "#/components/parameters/Query" }
        - name: category
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 24, default: 12 }
        - name: postSkip
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Public blog content
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ContentPayload" }
  /watch-events:
    get:
      tags: [Transmissions]
      summary: List active live transmissions and watch parties
      operationId: getMobileWatchEvents
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 50 }
      responses:
        "200":
          description: Active transmissions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/MobileWatchEvent" }
  /watch-events/{slug}:
    get:
      tags: [Transmissions]
      summary: Load transmission details and participating venues
      operationId: getMobileWatchEvent
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Transmission details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/MobileWatchEventDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
  /views:
    post:
      tags: [Analytics]
      summary: Increment a public content view counter
      operationId: recordMobileView
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ViewRequest" } } }
      responses:
        "200": { description: View recorded, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BadRequest" }
  /me/recommendations:
    get:
      tags: [User]
      summary: Load personalized recommendations for the authenticated user
      security: [{ bearerAuth: [] }]
      operationId: getMobileRecommendations
      responses:
        "200":
          description: Personalized home recommendations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/RecommendationsPayload" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/profile:
    get:
      tags: [User]
      summary: Read the authenticated user's profile
      security: [{ bearerAuth: [] }]
      operationId: getMobileProfile
      responses:
        "200": { description: Profile, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/following:
    get:
      tags: [User]
      summary: List venues followed by the authenticated user
      security: [{ bearerAuth: [] }]
      operationId: getMobileFollowing
      responses:
        "200":
          description: Followed venues
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/FollowingRecord" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [User]
      summary: Follow an approved venue
      security: [{ bearerAuth: [] }]
      operationId: followMobileVenue
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/FollowingRequest" } } }
      responses:
        "200": { description: Venue followed, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BadRequest" }
    delete:
      tags: [User]
      summary: Stop following a venue
      security: [{ bearerAuth: [] }]
      operationId: unfollowMobileVenue
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/FollowingRequest" } } }
      responses:
        "200": { description: Venue unfollowed, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/BadRequest" }
  /me/badges:
    get:
      tags: [User]
      summary: List badges earned by the authenticated user
      security: [{ bearerAuth: [] }]
      operationId: getMobileBadges
      responses:
        "200":
          description: Earned badges
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/MobileBadge" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /routes:
    get:
      tags: [Content]
      summary: List approved itinerary routes
      operationId: listMobileRoutes
      parameters:
        - { in: query, name: type, schema: { type: string } }
        - { in: query, name: difficulty, schema: { type: string } }
        - { in: query, name: days, schema: { type: integer, minimum: 1, maximum: 14 } }
        - { in: query, name: featured, schema: { type: string, enum: ["true", "false"] } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - in: query
          name: cursor
          schema: { type: string }
          description: Id of the last route of the previous page.
      responses:
        "200":
          description: Routes page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/MobileRouteSummary" }
                      meta:
                        type: object
                        properties:
                          hasMore: { type: boolean }
                          nextCursor: { type: [string, 'null'] }
        "422": { $ref: "#/components/responses/ValidationError" }
  /routes/{slug}:
    get:
      tags: [Content]
      summary: Itinerary detail with stops grouped by day
      operationId: getMobileRoute
      parameters:
        - { in: path, name: slug, required: true, schema: { type: string } }
      responses:
        "200":
          description: Route detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/MobileRouteDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
  /popular:
    get:
      tags: [Content]
      summary: Most viewed venues or events in a recent window
      description: >-
        Ranked from the shared view log written by the app, the site and the
        installed PWA, so the ordering is the same everywhere. Distinct from the
        lifetime `viewCount`, which never decays.
      operationId: getMobilePopularNow
      parameters:
        - { in: query, name: kind, schema: { type: string, enum: [venue, event], default: venue } }
        - { in: query, name: window, schema: { type: string, enum: ["24h", "7d"], default: "24h" } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 20, default: 10 } }
      responses:
        "200":
          description: Ranked items with their recent view counts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            slug: { type: string }
                            recentViews: { type: integer }
        "422": { $ref: "#/components/responses/ValidationError" }
  /collections/{slug}:
    get:
      tags: [Content]
      summary: Public collection by slug
      description: >-
        A private collection answers 404 rather than 403 so the response never
        confirms that a slug exists to someone who cannot see it. A bearer token
        only adds `isSaved` and `isMine`.
      operationId: getMobilePublicCollection
      parameters:
        - { in: path, name: slug, required: true, schema: { type: string } }
      responses:
        "200":
          description: Collection detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/MobilePublicCollection" }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/claims:
    get:
      tags: [User]
      summary: List the authenticated user's business claims
      security: [{ bearerAuth: [] }]
      operationId: listMobileClaims
      responses:
        "200":
          description: Claims
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/MobileClaim" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [User]
      summary: Claim a business
      description: >-
        Mails a six digit code valid for 15 minutes. Rate limited, because it
        sends mail on behalf of the caller.
      security: [{ bearerAuth: [] }]
      operationId: createMobileClaim
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClaimSubmitRequest" }
      responses:
        "200":
          description: Claim created, verification code sent
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          claimId: { type: string }
                          venueSlug: { type: string }
                          confidenceScore: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: "Already the owner, or a claim is already open" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { description: Too many claim attempts }
  /me/claims/{id}/verify:
    post:
      tags: [User]
      summary: Verify a claim's e-mail code
      security: [{ bearerAuth: [] }]
      operationId: verifyMobileClaim
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: "^\\d{6}$" }
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          verified: { type: boolean }
                          confidenceScore: { type: integer }
                          attemptsLeft: { type: integer }
        "400": { description: Wrong code }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: The claim belongs to someone else }
        "410": { description: The code expired }
        "429": { description: Too many attempts }
  /me/claims/{id}/evidence:
    post:
      tags: [User]
      summary: Attach uploaded proof to a claim
      description: The file is uploaded through `/me/uploads`; this records its URL.
      security: [{ bearerAuth: [] }]
      operationId: attachMobileClaimEvidence
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [evidenceUrl]
              properties:
                evidenceUrl: { type: string, format: uri }
                evidenceName: { type: [string, 'null'] }
      responses:
        "200":
          description: Evidence attached and the claim re-scored
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          confidenceScore: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: The claim belongs to someone else }
  /me/reviews/{id}/reply:
    patch:
      tags: [User]
      summary: Reply to a review as the business owner
      security: [{ bearerAuth: [] }]
      operationId: replyToMobileReview
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reply]
              properties:
                reply: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: Reply published
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id: { type: string }
                          ownerReply: { type: string }
                          ownerReplyAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Not the owner of the listing }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/venues/{slug}/insights:
    get:
      tags: [User]
      summary: Owner metrics for one venue
      description: >-
        `viewSeries` only reaches back `retentionDays`, the window the view log
        is kept for; `lifetimeViews` is the all-time counter and is reported
        separately rather than mixed into the series.
      security: [{ bearerAuth: [] }]
      operationId: getMobileVenueInsights
      parameters:
        - { in: path, name: slug, required: true, schema: { type: string } }
      responses:
        "200":
          description: Insights
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/MobileVenueInsights" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Not the owner of the venue }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/devices:
    post:
      tags: [User]
      summary: Register or refresh this device's push token
      description: >-
        Idempotent on the token. Upserting reassigns the device when another
        account signs in on the same phone, so the previous owner stops
        receiving its notifications.
      security: [{ bearerAuth: [] }]
      operationId: registerMobileDevice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceRegistrationRequest" }
      responses:
        "200":
          description: Registered device
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DeviceRegistration" }
        "401": { $ref: "#/components/responses/Unauthorized" }
